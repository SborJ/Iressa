<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Iressa — watch a tumour evolve</title>
<style>
/* ──────────────────────────────────────────────────────────────────────────
   Iressa

   The scene is the content; this is in service of it. Hierarchy comes from
   weight and colour rather than size, there are four type sizes, elevation is
   expressed by lightening a surface rather than by a shadow, and colour is
   only used where it means something.
   ────────────────────────────────────────────────────────────────────────── */
:root {
  color-scheme: dark;

  /* Ground and elevation. Never pure black: it crushes the render and makes
     every edge a hard line. Each step up is a lighter surface. */
  --bg:       #0a0c10;
  --surface:  #13161c;
  --raised:   #1a1e26;
  --hover:    #222733;
  --line:     #252a34;
  --line-soft:#1d222a;

  /* Ink */
  --fg:       #f0f2f6;
  --fg-2:     #a2abb9;
  --fg-3:     #828b9a;

  /* Accent: a desaturated teal. Saturated hues vibrate on dark, and plain
     blue is the default of every medical product there has ever been. */
  --accent:     #46b6c6;
  --accent-dim: #2b6f7a;
  --accent-wash:rgba(70,182,198,0.12);

  /* Semantic. Warm is rare in this palette, so it carries the alarm. */
  --grow:   #a2abb9;   /* growth is the default state, not good news: no colour */
  --respond:#46b6c6;
  --resist: #e8a33d;
  --danger: #e5705f;

  /* 8px base, 4px half-step. Every gap below is one of these and nothing else. */
  --s1: 4px;
  --s2: 8px;
  --s3: 12px;
  --s4: 16px;
  --s5: 24px;
  --s6: 32px;

  --r-lg: 12px;
  --r-md: 10px;
  --r-sm: 6px;

  --sans: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Inter", "Segoe UI", Roboto, system-ui, sans-serif;
  --mono: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, monospace;

  --ease: cubic-bezier(0.22, 0.61, 0.36, 1);   /* ease-out: the workhorse */
  --t: 200ms;

  --panel-w: 332px;
  --top-h: 58px;
}

* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; overflow: hidden; }
body {
  background: var(--bg);
  color: var(--fg);
  font: 400 13px/1.5 var(--sans);
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}
button, input { font: inherit; color: inherit; }

/* ── layout ─────────────────────────────────────────────────────────────── */
#app {
  display: grid;
  grid-template-columns: var(--panel-w) 1fr;
  grid-template-rows: var(--top-h) 1fr;
  grid-template-areas: "top top" "panel stage";
  height: 100%;
}
#topbar { grid-area: top;   border-bottom: 1px solid var(--line-soft); background: var(--surface); }
#panel  { grid-area: panel; border-right: 1px solid var(--line-soft); background: var(--surface);
          overflow-y: auto; overflow-x: hidden; }
#stage  { grid-area: stage; position: relative; overflow: hidden; min-width: 0; }
#scene  { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }

#panel::-webkit-scrollbar { width: 10px; }
#panel::-webkit-scrollbar-thumb { background: var(--line); border-radius: 5px; border: 3px solid var(--surface); }

/* ── top bar: identity, the headline, the view switch ───────────────────── */
#topbar { display: flex; align-items: center; gap: var(--s4); padding: 0 var(--s4) 0 var(--s5); }
.brand { display: flex; align-items: baseline; gap: 9px; flex: none; }
.brand .mark { font-size: 15px; font-weight: 600; letter-spacing: -0.02em; }
.brand .sub { font-size: 11.5px; color: var(--fg-3); }
.topdiv { width: 1px; height: 24px; background: var(--line); flex: none; }

/* The headline: what is happening, in words. */
#headline { display: flex; align-items: center; gap: 10px; min-width: 0; flex: 1; }
#headline .dot { width: 7px; height: 7px; border-radius: 50%; flex: none; transition: background var(--t) var(--ease); }
#headline .say { font-size: 13.5px; font-weight: 500; letter-spacing: -0.01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#headline .because { font-size: 12.5px; color: var(--fg-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* ── segmented control ──────────────────────────────────────────────────── */
.seg { display: inline-flex; background: var(--raised); border-radius: var(--r-md); padding: 3px; gap: 2px; flex: none; }
.seg button {
  border: 0; background: transparent; color: var(--fg-2);
  padding: 6px 12px; border-radius: var(--r-sm); cursor: pointer;
  font-size: 12.5px; font-weight: 500; white-space: nowrap;
  transition: background var(--t) var(--ease), color var(--t) var(--ease);
}
.seg button:hover:not(:disabled):not([aria-pressed="true"]) { background: var(--hover); color: var(--fg); }
.seg button[aria-pressed="true"] { background: var(--accent-wash); color: var(--accent); }
.seg button:disabled { color: var(--fg-3); cursor: not-allowed; }
.seg.full { display: flex; width: 100%; }
.seg.full button { flex: 1 1 0; min-width: 0; overflow: hidden; text-overflow: ellipsis; }

/* ── buttons ────────────────────────────────────────────────────────────── */
.btn {
  border: 0; background: var(--raised); color: var(--fg);
  border-radius: var(--r-md); padding: var(--s2) var(--s3); cursor: pointer;
  font-size: 12.5px; font-weight: 500;
  transition: background var(--t) var(--ease), border-color var(--t) var(--ease), transform 90ms var(--ease);
}
.btn:hover { background: var(--hover); }
.btn:active { transform: scale(0.97); }
.btn.primary { background: var(--accent-wash); color: var(--accent); }
.btn.primary:hover { background: rgba(70,182,198,0.2); }
.btn.icon { padding: 7px 10px; }
.btn.ghost { background: transparent; color: var(--fg-2); }
.btn.ghost:hover { background: var(--hover); color: var(--fg); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: var(--r-sm); }

/* ── the panel ──────────────────────────────────────────────────────────── */
.block { padding: var(--s5) var(--s5) var(--s5); border-bottom: 1px solid var(--line-soft); }
.block:last-child { border-bottom: 0; }

/* hero: one number, large, with its trend */
.hero .label { font-size: 11.5px; font-weight: 500; color: var(--fg-3); letter-spacing: 0.02em; }
.hero .value { font-size: 36px; font-weight: 600; letter-spacing: -0.03em; line-height: 1.1; margin-top: var(--s1);
               font-variant-numeric: tabular-nums; }
.hero .under { display: flex; align-items: center; gap: var(--s2); margin-top: var(--s2); font-size: 12.5px; color: var(--fg-2); }
.hero .trend { font-weight: 500; font-variant-numeric: tabular-nums; }
.hero .trend { transition: color var(--t) var(--ease); }

/* a disclosure: the common question is answered without opening anything */
details.fold { border-top: 1px solid var(--line-soft); }
details.fold:first-of-type { border-top: 0; }
details.fold > summary {
  list-style: none; cursor: pointer; padding: var(--s3) var(--s5);
  display: flex; align-items: center; gap: var(--s2);
  font-size: 12.5px; font-weight: 500; color: var(--fg-2);
  transition: color var(--t) var(--ease), background var(--t) var(--ease);
}
details.fold > summary::-webkit-details-marker { display: none; }
details.fold > summary:hover { color: var(--fg); background: var(--raised); }
details.fold > summary .chev {
  width: 12px; height: 12px; flex: none; color: var(--fg-3);
  transition: transform var(--t) var(--ease);
}
details.fold[open] > summary .chev { transform: rotate(90deg); }
details.fold > summary > span:not(.sum) { white-space: nowrap; flex: none; }
details.fold > summary .sum { margin-left: auto; color: var(--fg-3); font-weight: 400;
  font-variant-numeric: tabular-nums; text-align: right; overflow: hidden;
  text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.fold-body { padding: var(--s1) var(--s5) var(--s5); }

/* rows */
.r { display: flex; align-items: baseline; gap: var(--s3); padding: var(--s1) 0; }
.r .k { color: var(--fg-2); flex: 1; min-width: 0; font-size: 12.5px; }
.r .v { font-variant-numeric: tabular-nums; font-size: 12.5px; font-weight: 500; white-space: nowrap; }
.r .v .u { color: var(--fg-3); font-weight: 400; }
.r .v .d { color: var(--fg-3); font-weight: 400; margin-left: 7px; }
.r.mono .v { font-family: var(--mono); font-size: 11.5px; font-weight: 400; }
.r.mono .k { font-family: var(--mono); font-size: 11.5px; color: var(--fg-3); }

/* a term you can ask about */
.term { border-bottom: 1px dotted var(--fg-3); cursor: help; }

/* bars */
.dots { display: flex; gap: 2px; height: 7px; border-radius: 4px; overflow: hidden; margin: var(--s2) 0 var(--s3); background: var(--raised); }
.dots > i { display: block; transition: width var(--t) var(--ease); }
.keyline { display: flex; align-items: center; gap: var(--s2); padding: var(--s1) 0; font-size: 12.5px; }
.keyline .sw { width: 10px; height: 10px; border-radius: 3px; flex: none;
                box-shadow: inset 0 0 0 1px rgba(255,255,255,0.14); }
.keyline .n { color: var(--fg-2); flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.keyline .c { font-variant-numeric: tabular-nums; font-weight: 500; }
.keyline.mut { cursor: crosshair; border-radius: var(--r-sm); margin: 0 -6px; padding: 3px 6px; transition: background var(--t) var(--ease); }
.keyline.mut:hover { background: var(--raised); }
.keyline.dim { opacity: 0.4; }

.note { margin: 0; color: var(--fg-3); font-size: 11.5px; line-height: 1.55; }
.note b { color: var(--fg-2); font-weight: 500; }
.muted { color: var(--fg-3); font-size: 12px; }

/* ── stage furniture ────────────────────────────────────────────────────── */
.over { position: absolute; z-index: 3; }
#stagetop { top: var(--s4); left: var(--s4); right: var(--s4); display: flex; align-items: flex-start; gap: var(--s2); pointer-events: none; }
#stagetop > * { pointer-events: auto; }
.pill {
  background: rgba(19,22,28,0.92); border-radius: var(--r-md);
  padding: var(--s2) var(--s3); font-size: 12px; color: var(--fg-2);
  display: inline-flex; align-items: center; gap: var(--s2);
}
.pill .sw { width: 9px; height: 9px; border-radius: 2.5px; }
.pill b { color: var(--fg); font-weight: 500; }

#scalebar { left: var(--s5); bottom: 104px; display: flex; align-items: center; gap: 9px; color: #fff; mix-blend-mode: difference; pointer-events: none; }
#scalebar .bar { height: 2px; background: currentColor; border-radius: 1px; }
#scalebar .lab { font-size: 11.5px; font-weight: 500; font-variant-numeric: tabular-nums; }

/* hover card: near the pointer, offset, never under it */
#card {
  position: fixed; z-index: 20; pointer-events: none; display: none;
  min-width: 212px; max-width: 272px;
  background: var(--raised);
  border-radius: var(--r-lg); padding: var(--s3) var(--s4);
  box-shadow: 0 16px 40px rgba(0,0,0,0.6), 0 0 0 1px rgba(255,255,255,0.05);
}
#card.on { display: block; }
#card .ttl { font-size: 13.5px; font-weight: 600; letter-spacing: -0.01em; display: flex; align-items: center; gap: 8px; }
#card .why { font-size: 12.5px; color: var(--fg-2); margin-top: 3px; }
#card hr { border: 0; border-top: 1px solid var(--line-soft); margin: var(--s3) calc(var(--s4) * -1); }

/* oxygen gauge */
.gauge { margin-top: 3px; }
.gauge .tr { position: relative; height: 5px; border-radius: 3px; background: var(--raised); overflow: visible; }
.gauge .fl { position: absolute; inset: 0 auto 0 0; border-radius: 3px; transition: width var(--t) var(--ease); }
.gauge .tk { position: absolute; top: -2px; bottom: -2px; width: 1px; background: var(--fg-3); }
.gauge .cap { display: flex; justify-content: space-between; margin-top: 5px; font-size: 11px; color: var(--fg-3); }

/* ── timeline ───────────────────────────────────────────────────────────── */
#timeline {
  position: absolute; left: var(--s4); right: var(--s4); bottom: var(--s4); height: 72px; z-index: 3;
  background: rgba(19,22,28,0.94); border-radius: var(--r-lg);
  padding: 0 var(--s4); display: flex; align-items: center; gap: var(--s4);
}
#timeline .play { flex: none; }
#timeline .track { flex: 1; position: relative; height: 100%; min-width: 0; }
#timeline svg { position: absolute; inset: 0; width: 100%; height: 100%; }
#timeline .clock { flex: none; font-variant-numeric: tabular-nums; font-size: 12.5px; font-weight: 500; }
#timeline .clock span { color: var(--fg-3); font-weight: 400; }

/* ── chart ──────────────────────────────────────────────────────────────── */
#chart svg { display: block; width: 100%; }
.axis text { fill: var(--fg-3); font-size: 10.5px; }
.axis line { stroke: var(--line); }
.marker { stroke: var(--line); stroke-dasharray: 2 3; }
.marker-label { fill: var(--fg-3); font-size: 10px; }
.crosshair { stroke: var(--fg-2); stroke-width: 1; pointer-events: none; }
table.data { width: 100%; border-collapse: collapse; font-size: 11.5px; font-variant-numeric: tabular-nums; }
table.data th { text-align: right; color: var(--fg-3); font-weight: 500; padding: 5px 6px; border-bottom: 1px solid var(--line-soft); position: sticky; top: 0; background: var(--surface); }
table.data th:first-child, table.data td:first-child { text-align: left; }
table.data td { text-align: right; padding: 3px 6px; color: var(--fg-2); }
.table-wrap { max-height: 170px; overflow: auto; }

/* ── error ──────────────────────────────────────────────────────────────── */
#error { position: fixed; inset: 0; display: none; place-items: center; padding: 40px; background: var(--bg); z-index: 100; overflow: auto; }
#error.on { display: grid; }
#error .box { max-width: 720px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); padding: 26px 28px; }
#error h1 { font-size: 16px; font-weight: 600; margin: 0 0 6px; color: var(--danger); letter-spacing: -0.01em; }
#error p { color: var(--fg-2); margin: 0 0 16px; font-size: 13px; }
#error ul { margin: 0; padding-left: 18px; font-family: var(--mono); font-size: 12px; color: var(--fg); }
#error li { margin-bottom: 5px; }

@media (max-width: 1180px) { :root { --panel-w: 296px; } }
@media (prefers-reduced-motion: reduce) { * { transition-duration: 1ms !important; } }
</style>
</head>
<body>

<div id="app">
  <header id="topbar">
    <div class="brand">
      <span class="mark">Iressa</span>
      <span class="sub">tumour evolution under treatment</span>
    </div>
    <div class="topdiv"></div>
    <div id="headline"><span class="dot"></span><span class="say"></span><span class="because"></span></div>
    <div id="viewswitch" class="seg"></div>
  </header>

  <aside id="panel"></aside>

  <main id="stage">
    <canvas id="scene"></canvas>
    <div id="stagetop" class="over"></div>
    <div id="scalebar" class="over"><span class="bar"></span><span class="lab"></span></div>
    <div id="timeline"></div>
  </main>
</div>

<div id="card"></div>

<div id="error"><div class="box">
  <h1 id="error-title"></h1>
  <p id="error-note"></p>
  <ul id="error-list"></ul>
</div></div>

<script type="module" src="/src/main.ts"></script>
</body>
</html>
